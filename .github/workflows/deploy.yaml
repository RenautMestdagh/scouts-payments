name: Deploy project

on:
  push:
    branches:
      - master
  workflow_dispatch:
  
jobs:
  docker-build-and-push:
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo
          uses: actions/checkout@v2

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3
      
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      
        - name: Build and push
          uses: docker/build-push-action@v3
          with:
            context: ./
            platforms: linux/amd64,linux/arm64
            file: ./Dockerfile
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/scoutspayments:latest

        # Komodo pulls :latest and recreates the container. The API key belongs to a
        # Komodo service user that may only deploy the scouts-payments stack.
        - name: Deploy on webhosting via Komodo
          env:
            KOMODO_URL: https://komodo.rennet.duckdns.org
            KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
            KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          run: |
            komodo() {
              curl -sSf -X POST "$KOMODO_URL/$1" \
                -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
                -H "content-type: application/json" -d "$2"
            }
            id=$(komodo execute/DeployStack '{"stack":"scouts-payments"}' | jq -r '._id["$oid"]')
            for i in $(seq 60); do
              update=$(komodo read/GetUpdate "{\"id\":\"$id\"}")
              [ "$(echo "$update" | jq -r .status)" = "Complete" ] && break
              sleep 5
            done
            echo "$update" | jq -r '.logs[] | "## \(.stage)\n\(.stdout)\(.stderr)"'
            [ "$(echo "$update" | jq -r .success)" = "true" ]
